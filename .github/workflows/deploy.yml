name: Deploy to Server

on:
  push:
    branches:
      - main # يتم التشغيل عند الرفع على فرع main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Sync files to server via rsync
        run: |
          sudo apt-get install -y sshpass rsync
          sshpass -p "${{ secrets.SERVER_PASSWORD }}" rsync -avz --exclude='.env' --exclude='/storage' --exclude='/vendor' --exclude='.git' -e "ssh -o StrictHostKeyChecking=no -p 22" ./ ${{ secrets.SERVER_USERNAME }}@${{ secrets.SERVER_IP }}:/var/www/scouters/

      - name: Run post-deploy commands via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          script_stop: true
          script: |
            cd /var/www/scouters
            
            # التأكد من وجود مجلد الكاش وإعطائه التصاريح اللازمة
            mkdir -p bootstrap/cache
            chmod -R 777 bootstrap/cache
            chmod -R 777 storage
            
            # تحديث الحزم
            composer install --no-interaction --prefer-dist --optimize-autoloader
            
            # تنفيذ أوامر قواعد البيانات إن وجدت
            php artisan migrate --force
            
            # تنظيف الكاش
            php artisan optimize:clear
